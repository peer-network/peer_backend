log_format frontend_log '$remote_addr - [$time_local] '
                        '"$request" '
                        'status: $status '
                        'request_id: $http_x_request_id '
                        'upstream: $upstream_addr '
                        'upstream_time: $upstream_response_time';

access_log /var/log/nginx/frontend_access.log frontend_log;

server {
    listen 80;
    index host.php;
    root /var/www/html/public;

    # Stack P matches peergamma's body limit (500M); see infra/stack-p/nginx.conf.
    client_max_body_size 500M;
    client_body_buffer_size 1M;

    # Generate a request id if upstream nginx (cloudflared origin) didn't set one.
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # /health is served by host.php's proxy path (forwards to PHP backend).
    # If you want a frontend-local health check, add a static one above this rule.

    location / {
        # Always send through host.php so dual-dispatch can run.
        try_files /host.php =500;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index host.php;
        fastcgi_param SCRIPT_FILENAME $document_root/host.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        # The body limit cascades into PHP's max upload size; see Dockerfile.frontend.
    }

    location ~ /\.ht {
        deny all;
    }
}
